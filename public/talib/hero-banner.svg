<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D30"/>
      <stop offset="50%" stop-color="#1B5E4B"/>
      <stop offset="100%" stop-color="#2E7D62"/>
    </linearGradient>
    <linearGradient id="bannerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8956C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8956C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bannerBg)"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  <rect width="800" height="400" fill="url(#bannerAccent)"/>
  <!-- Decorative academic SVG icons -->
  <g transform="translate(580, 80)" opacity="0.18">
    <!-- Book -->
    <rect x="0" y="0" width="160" height="120" rx="8" fill="white"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#1B5E4B" stroke-width="2"/>
    <line x1="20" y1="30" x2="60" y2="30" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="70" x2="60" y2="70" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="30" x2="140" y2="30" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="50" x2="140" y2="50" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="70" x2="140" y2="70" stroke="#1B5E4B" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(80, 220)" opacity="0.2">
    <!-- Graduation cap -->
    <path d="M0 40 L60 20 L120 40 L60 60 Z" fill="white"/>
    <path d="M30 50 L30 80 Q30 90 60 90 Q90 90 90 80 L90 50" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="120" cy="40" r="3" fill="#C8956C"/>
    <line x1="120" y1="40" x2="120" y2="70" stroke="#C8956C" stroke-width="2"/>
  </g>
</svg>
